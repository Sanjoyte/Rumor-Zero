<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}Rumor Zero{% endblock title %}</title>
</head>
<body style="margin:0;padding:0;background-color:#faf8ff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#faf8ff;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
<tr>
<td align="center" style="background-color:#283044;padding:24px;border-radius:8px 8px 0 0;">
<img src="{{ email_logo_url }}" alt="Rumor Zero" width="160" style="display:block;width:160px;max-width:100%;height:auto;border:0;">
</td>
</tr>
<tr>
<td style="background-color:#ffffff;padding:32px 28px;border-radius:0 0 8px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#3c4946;">
{% block content %}{% endblock content %}
</td>
</tr>
<tr>
<td align="center" style="padding:16px 12px 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#3c4946;">
Rumor Zero
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
